services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claireadresse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claireadresse}
      POSTGRES_DB: ${POSTGRES_DB:-claire_adresse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claireadresse} -d ${POSTGRES_DB:-claire_adresse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose uniquement sur localhost (pour les scripts d'import depuis l'hôte).
    # Retire ce bloc en production si les imports sont exécutés via `docker compose run`.
    ports:
      - "127.0.0.1:5432:5432"

  # Variante PUBLIC — image buildée avec SITE_VARIANT=PUBLIC. Sert claireadresse.fr.
  app:
    image: ghcr.io/jolivem/vibenu:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-claireadresse}:${POSTGRES_PASSWORD:-claireadresse}@postgres:5432/${POSTGRES_DB:-claire_adresse}
      NEXT_PUBLIC_DVF_SOURCE: ${NEXT_PUBLIC_DVF_SOURCE:-database}
      NEXT_PUBLIC_DEBUG: ${NEXT_PUBLIC_DEBUG:-false}
      SITE_URL: ${SITE_URL:-}
      ATMO_USERNAME: ${ATMO_USERNAME:-}
      ATMO_PASSWORD: ${ATMO_PASSWORD:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Variante PRO — image buildée avec SITE_VARIANT=PRO. Sert pro.claireadresse.fr.
  # Même base postgres + mêmes credentials Atmo/Mistral.
  app_pro:
    image: ghcr.io/jolivem/vibenu:${APP_PRO_IMAGE_TAG:-pro-latest}
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-claireadresse}:${POSTGRES_PASSWORD:-claireadresse}@postgres:5432/${POSTGRES_DB:-claire_adresse}
      NEXT_PUBLIC_DVF_SOURCE: ${NEXT_PUBLIC_DVF_SOURCE:-database}
      NEXT_PUBLIC_DEBUG: ${NEXT_PUBLIC_DEBUG:-false}
      SITE_URL: ${SITE_URL_PRO:-}
      ATMO_USERNAME: ${ATMO_USERNAME:-}
      ATMO_PASSWORD: ${ATMO_PASSWORD:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Analyse d'audience — réutilise le PostgreSQL existant (base dédiée `umami`).
  # La base doit être créée une fois : voir README / commande `CREATE DATABASE umami`.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_TYPE: postgresql
      # Mot de passe URL-encodé (le "@" du mot de passe Postgres devient "%40").
      DATABASE_URL: postgresql://${POSTGRES_USER:-claireadresse}:${UMAMI_DB_PASSWORD_ENC:-claireadresse}@postgres:5432/${UMAMI_DB:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Domaine optionnel pour le routing aicorrect.app (containers déployés
      # depuis le repo aicorrect, joints via le network externe caddy_network).
      AICORRECT_DOMAIN: ${AICORRECT_DOMAIN:-aicorrect.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - app_pro
      - umami
    networks:
      - default
      - caddy_network

networks:
  default:
  # Network partagé avec les autres stacks déployés sur le VPS (aicorrect, ...).
  # À créer une fois : `docker network create caddy_network`.
  caddy_network:
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
